name: vidflow
description: VidFlow — 全功能本地视频播放器。iOS 27 玻璃质感 UI。
publish_to: 'none'
version: 1.0.10+10
homepage: https://github.com/Kimcop-kc/vidflow
repository: https://github.com/Kimcop-kc/vidflow

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 播放引擎 (media_kit_video 1.x 兼容 Flutter 3.22)
  media_kit: 1.2.0
  media_kit_video: 1.2.0
  media_kit_libs_video: 1.0.0

  # 状态管理
  flutter_riverpod: 2.5.1
  riverpod_annotation: 2.3.5

  # 路由
  go_router: 14.8.0

  # 本地存储
  sqflite: 2.3.0
  shared_preferences: 2.2.2
  path_provider: 2.1.5
  path: 1.9.0

  # 权限
  permission_handler: 11.3.1

  # 视频缩略图
  flutter_video_thumbnail_plus: 1.0.6

  # 工具
  intl: 0.19.0
  uuid: 4.5.1
  # Flutter 3.22 的 flutter_test 将 collection 锁定为 1.18.0，这里不能超过它
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
