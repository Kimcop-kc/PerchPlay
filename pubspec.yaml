name: perchplay
description: PerchPlay — 全功能本地视频播放器，玻璃拟态 UI。
publish_to: 'none'
version: 1.0.75+75
homepage: https://github.com/Kimcop-kc/PerchPlay
repository: https://github.com/Kimcop-kc/PerchPlay

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 播放引擎 (media_kit_video 1.x 兼容 Flutter 3.22)
  media_kit: 1.2.0
  media_kit_video: 1.2.0
  media_kit_libs_video: 1.0.0
  # 1.3.8 把 compileSdkVersion 提成了 36，而 Flutter 3.22 自带的 AGP 8.1 的 aapt2
  # 解析不了 API 36 的 android.jar（:verifyReleaseResources 报 RES_TABLE_TYPE_TYPE
  # entry offsets overlap actual entry data）。1.3.7 仍是 compileSdk 31，钉住它。
  media_kit_libs_android_video: 1.3.7

  # Windows 桌面播放
  media_kit_libs_windows_video: 1.0.9

  # 状态管理
  flutter_riverpod: 2.5.1
  riverpod_annotation: 2.3.5

  # 路由
  go_router: 14.8.0

  # 本地存储
  sqflite: 2.3.0
  shared_preferences: 2.2.2
  path_provider: 2.1.5
  path: 1.9.0

  # 权限
  permission_handler: 11.3.1

  # 系统亮度控制（media_kit_video 已依赖 ^0.2.2）
  screen_brightness: ^0.2.2

  # 视频缩略图
  flutter_video_thumbnail_plus: 1.0.6

  # 工具
  intl: 0.19.0
  uuid: 4.5.1
  # Flutter 3.22 的 flutter_test 将 collection 锁定为 1.18.0，这里不能超过它
  collection: ^1.18.0
  # TMDB 刮削 & 海报缓存
  http: ^1.2.0
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  image: ^4.12.0
  sherpa_onnx: ^1.13.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/branding/
