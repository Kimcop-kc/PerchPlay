name: vidflow
description: VidFlow — 全功能本地视频播放器。iOS 27 玻璃质感 UI。
publish_to: 'none'
version: 1.0.4+4
homepage: https://github.com/Kimcop-kc/vidflow
repository: https://github.com/Kimcop-kc/vidflow

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 播放引擎
  media_kit: any
  media_kit_video: any
  # media_kit_libs_video 已包含 iOS 音频支持；libs_video + libs_audio 在 iOS 不能共存
  media_kit_libs_video: any

  # 状态管理
  flutter_riverpod: any
  riverpod_annotation: any

  # 路由
  go_router: any

  # 本地存储
  sqflite: any
  shared_preferences: any
  path_provider: any
  path: any

  # 权限
  permission_handler: any

  # 视频缩略图
  video_thumbnail: any

  # 工具
  intl: any
  uuid: any
  collection: any
  freezed_annotation: any
  json_annotation: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  build_runner: any
  freezed: any
  json_serializable: any
  riverpod_generator: any

flutter:
  uses-material-design: true
  assets:
    - assets/icons/