name: 验证 — libplacebo libmpv 构建

# 目的：**只做可行性验证**，不产出任何发版产物。
#
# 目标：确认 media-kit 的 Android libmpv 构建链能否在开启
#       libplacebo + vulkan + shaderc 后成功编译出 libmpv.so。
#
# 成功 → 继续做 hdr-toys 集成（路线 A 可行）
# 失败 → 停止，不做更多投入
#
# ⚠ 关键：必须完全复刻官方 CI 的环境，否则会在依赖环节莫名失败。
#   官方用的是 ubuntu-22.04 + **软链接 Actions 预装的 Android SDK**
#   （不是跑 download.sh 自己下 SDK/NDK）。
#   参考 media-kit/libmpv-android-video-build/.github/workflows/build.yaml

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '要构建的架构'
        required: false
        default: 'arm64'
        type: choice
        options:
          - arm64
          - armv7l

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: 检出本仓库（拿 patch 脚本）
        uses: actions/checkout@v4

      - name: 检出 media-kit 的 libmpv 构建仓库
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/media-kit/libmpv-android-video-build.git build-repo
          echo "构建仓库 HEAD: $(git -C build-repo rev-parse --short HEAD)"

      - name: 应用 libplacebo patch
        run: |
          set -euo pipefail
          chmod +x tools/patch_libplacebo.sh
          bash tools/patch_libplacebo.sh "$PWD/build-repo" "$PWD/tools"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装构建工具
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            meson ninja-build pkg-config \
            autoconf automake libtool gperf \
            nasm yasm cmake wget
          meson --version; ninja --version

      - name: Symlink SDK（复刻官方做法，不用 download.sh）
        working-directory: ./build-repo/buildscripts
        run: |
          set -euo pipefail
          mkdir -p sdk
          ln -sfn "${ANDROID_HOME}" ./sdk/android-sdk-linux
          ls -la sdk/
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "=== 可用 NDK ==="
          ls "${ANDROID_HOME}/ndk" || true

      - name: 对齐 NDK 版本（官方硬编码 25.2，预装只有 27+）
        run: |
          set -euo pipefail
          # patch 脚本 1e) 会读 ANDROID_HOME 探测实际 NDK 版本并改写 v_ndk，
          # 但上一步才建好软链，patch 在那之前跑过。这里再跑一次，
          # 此时 ANDROID_HOME 已就绪。
          bash tools/patch_libplacebo.sh "$PWD/build-repo" "$PWD/tools" 2>&1 | grep -E '1e\)|v_ndk|NDK' || true
          echo "--- 最终 v_ndk ---"
          grep '^v_ndk=' build-repo/buildscripts/include/depinfo.sh

      - name: 只下载依赖源码（跳过 SDK/NDK 下载）
        working-directory: ./build-repo/buildscripts
        run: |
          set -euo pipefail
          chmod +x include/download-deps.sh
          ./include/download-deps.sh
        timeout-minutes: 40

      - name: 准备 ffmpeg flavor
        working-directory: ./build-repo/buildscripts
        run: |
          set -euo pipefail
          rm -f scripts/ffmpeg.sh
          cp flavors/full.sh scripts/ffmpeg.sh
          echo "full flavor 已就位"

          ABI="${{ inputs.arch == 'armv7l' && 'armeabi-v7a' || 'arm64-v8a' }}"
          mkdir -p "prefix/$ABI/lib/pkgconfig" "prefix/$ABI/include"
          echo "已预建 prefix/$ABI/lib/pkgconfig"

      - name: 构建（shaderc → libplacebo → 其余 → mpv）
        id: build
        working-directory: ./build-repo/buildscripts
        run: |
          set -euo pipefail
          chmod +x build.sh
          ARCH="${{ inputs.arch }}"
          echo "=== 目标架构: $ARCH ==="
          ./build.sh --arch "$ARCH" mpv 2>&1 | tee /tmp/build.log
        timeout-minutes: 150

      - name: 检查产物与符号
        if: always()
        working-directory: ./build-repo/buildscripts
        run: |
          set -euo pipefail
          echo "=== libmpv.so ==="
          find . -name 'libmpv.so' -type f 2>/dev/null | while read -r f; do
            echo "  $f  ($(du -h "$f" | cut -f1))"
          done

          SO=$(find . -name 'libmpv.so' -type f | head -1)
          if [ -z "$SO" ]; then
            echo "❌ 没有产出 libmpv.so"
            echo ""
            echo "=== libplacebo 产物 ==="
            find prefix -name 'libplacebo*' 2>/dev/null || echo "无"
            exit 0
          fi

          echo ""
          echo "=== libmpv.so 详情 ==="
          ls -lh "$SO"
          SIZE=$(stat -c%s "$SO"); echo "字节数: $SIZE ($((SIZE/1048576)) MB)"
          readelf -d "$SO" 2>/dev/null | grep -E 'NEEDED|SONAME' || true

          echo ""
          echo "=== 关键符号 ==="
          echo -n "placebo 符号数: "; (nm -D "$SO" 2>/dev/null | grep -ci placebo) || echo 0
          echo -n "vulkan vk* 符号数: "; (nm -D "$SO" 2>/dev/null | grep -cE 'vk[A-Z][a-zA-Z]+') || echo 0
          echo -n "shaderc 符号数: "; (nm -D "$SO" 2>/dev/null | grep -ci shaderc) || echo 0

          echo ""
          echo "=== libplacebo 是否编出来 ==="
          find prefix -name 'libplacebo*' -exec ls -lh {} \; 2>/dev/null || echo "未找到"

          echo ""
          echo "=== libplacebo.pc 的 pl_has_vulkan ==="
          find . -name 'libplacebo.pc' -exec sh -c 'echo "--- {} ---"; cat "{}"' \; 2>/dev/null || true

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/build.log
          retention-days: 7
          if-no-files-found: warn

      - name: 结论
        if: always()
        run: |
          echo "================================================"
          echo "构建步骤结果: ${{ steps.build.outcome }}"
          echo "================================================"
          if [ "${{ steps.build.outcome }}" == "success" ]; then
            echo "✅ 路线 A 可行：libmpv 在 libplacebo 下编译成功"
          else
            echo "❌ 路线 A 受阻：编译失败，见 artifact 的 /tmp/build.log"
          fi
