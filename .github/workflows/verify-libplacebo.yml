name: 验证 — libplacebo libmpv 构建

# 目的：**只做可行性验证**，不产出任何发版产物。
#
# 目标：确认 media-kit 的 Android libmpv 构建链能否在开启
#       libplacebo + vulkan + shaderc 后成功编译出 libmpv.so。
#
# 成功 → 继续做 hdr-toys 集成（路线 A 可行）
# 失败 → 停止，不做更多投入
#
# 手动触发，只在需要时跑。失败不影响任何现有发版流程。

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '要构建的架构'
        required: false
        default: 'arm64'
        type: choice
        options:
          - arm64
          - armv7l

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 检出本仓库（拿 patch 脚本）
        uses: actions/checkout@v4

      - name: 检出 media-kit 的 libmpv 构建仓库
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/media-kit/libmpv-android-video-build.git build-repo
          echo "构建仓库 HEAD: $(git -C build-repo rev-parse --short HEAD)"

      - name: 应用 libplacebo patch
        run: |
          set -euo pipefail
          chmod +x tools/patch_libplacebo.sh
          bash tools/patch_libplacebo.sh "$PWD/build-repo" "$PWD/tools"

      - name: 安装构建工具
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            meson ninja-build pkg-config python3-pip \
            autoconf automake libtool gperf \
            nasm yasm cmake wget
          meson --version; ninja --version

      - name: 下载 SDK / NDK / 依赖源码
        run: |
          set -euo pipefail
          cd build-repo/buildscripts
          chmod +x download.sh
          # 完整输出（不 tail），失败时能看清原因
          ./download.sh
        timeout-minutes: 60

      - name: 准备 ffmpeg flavor（官方 bundle 流程要求）
        run: |
          set -euo pipefail
          cd build-repo/buildscripts
          # bundle_*.sh 里会做这一步；直接跑 build.sh 不做，
          # 导致 "chmod: cannot access '../../scripts/ffmpeg.sh'"。
          rm -f scripts/ffmpeg.sh
          cp flavors/full.sh scripts/ffmpeg.sh
          echo "已用 full flavor（解码器最全）"

          # 预建 prefix 子目录。
          # media-kit 的 setup_prefix 只建 prefix/<abi>/，**不建 lib、include**，
          # 而 shaderc.sh 会 `cp ... "$prefix_dir/lib/libshaderc_combined.a"`，
          # 于是报 No such file or directory。
          ABI="${{ inputs.arch == 'armv7l' && 'armeabi-v7a' || 'arm64-v8a' }}"
          mkdir -p "prefix/$ABI/lib/pkgconfig" "prefix/$ABI/include"
          echo "已预建 prefix/$ABI/{lib/pkgconfig,include}"
          ls -la "prefix/$ABI"

      - name: 构建（libplacebo → mpv，单架构）
        id: build
        run: |
          set -euo pipefail
          cd build-repo/buildscripts
          chmod +x build.sh
          ARCH="${{ inputs.arch }}"
          echo "=== 目标架构: $ARCH ==="
          # 完整输出不 tail：日志量可控，且失败时必须能看到原因
          ./build.sh --arch "$ARCH" mpv 2>&1 | tee /tmp/build.log
        timeout-minutes: 150

      - name: 检查产物与符号
        if: always()
        run: |
          set -euo pipefail
          cd build-repo/buildscripts
          echo "=== 查找 libmpv.so ==="
          find . -name 'libmpv.so' -type f 2>/dev/null | while read -r f; do
            echo "  $f  ($(du -h "$f" | cut -f1))"
          done

          SO=$(find . -name 'libmpv.so' -type f | head -1)
          echo ""
          if [ -z "$SO" ]; then
            echo "❌ 没有产出 libmpv.so"
            exit 0
          fi

          echo "=== libmpv.so 大小 ==="
          ls -lh "$SO"
          SIZE=$(stat -c%s "$SO")
          echo "字节数: $SIZE  ($((SIZE/1048576)) MB)"

          echo ""
          echo "=== 动态依赖 ==="
          readelf -d "$SO" 2>/dev/null | grep -E 'NEEDED|SONAME' || true

          echo ""
          echo "=== 关键符号检查 ==="
          echo -n "placebo 符号数: "
          (nm -D "$SO" 2>/dev/null | grep -ci placebo) || echo 0
          echo -n "vulkan (vk) 符号数: "
          (nm -D "$SO" 2>/dev/null | grep -cE 'vk[A-Z][a-zA-Z]+') || echo 0
          echo -n "shaderc 符号数: "
          (nm -D "$SO" 2>/dev/null | grep -ci shaderc) || echo 0

          echo ""
          echo "=== libplacebo 是否编出来 ==="
          ls -la ../../build-repo/buildscripts/prefix/*/lib/libplacebo* 2>/dev/null \
            || ls -la prefix/*/lib/libplacebo* 2>/dev/null \
            || echo "未找到 libplacebo.a"

          echo ""
          echo "=== libplacebo.pc 的 pl_has_vulkan ==="
          find . -name 'libplacebo.pc' -exec sh -c 'echo "--- {} ---"; cat "{}"' \; 2>/dev/null || true

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/build.log
          retention-days: 7
          if-no-files-found: warn

      - name: 结论
        if: always()
        run: |
          echo "================================"
          echo "构建步骤结果: ${{ steps.build.outcome }}"
          echo "================================"
          if [ "${{ steps.build.outcome }}" == "success" ]; then
            echo "✅ 路线 A 可行：libmpv 在 libplacebo 下编译成功"
          else
            echo "❌ 路线 A 受阻：编译失败，见 artifact 的 /tmp/build.log"
          fi
