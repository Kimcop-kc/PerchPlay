name: iOS — 构建 IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      export_method:
        description: 'IPA 导出方式'
        required: true
        type: choice
        options:
          - ad-hoc
          - development
          - app-store

permissions:
  contents: write

jobs:
  build-ios:
    name: iOS 构建 (${{ github.event.inputs.export_method || 'ad-hoc' }})
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22'
          channel: 'stable'
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 安装 CocoaPods
        run: |
          cd ios
          pod install 2>&1 | tail -10 || pod install --repo-update 2>&1 | tail -10
          cd ..

      - name: 构建 iOS (无签名)
        run: flutter build ios --release --no-codesign

      - name: 打包 IPA
        run: |
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            mkdir -p build/ios/ipa/Payload
            cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
            cd build/ios/ipa
            zip -r ../../VidFlow-${{ github.ref_name }}-unsigned.ipa Payload/
            echo "✓ IPA 打包完成"
          else
            echo "⚠️ 未找到 Runner.app，搜索构建目录..."
            find build/ios -maxdepth 4 -name "Runner.app" 2>/dev/null
            find build/ios -maxdepth 4 -type d 2>/dev/null | head -20
          fi

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.ref_name }}
          path: |
            build/ios/iphoneos/**/*
            build/VidFlow-*.ipa
          retention-days: 30

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/VidFlow-*.ipa
          fail_on_unmatched_files: false