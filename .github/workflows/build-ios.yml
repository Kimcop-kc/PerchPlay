name: iOS — 构建 IPA

# iOS 构建暂不启用自动触发（目前无有效签名证书，无法真机安装）
# 保留 workflow_dispatch 供将来手动构建
on:
  workflow_dispatch:
    inputs:
      export_method:
        description: 'IPA 导出方式'
        required: true
        type: choice
        options:
          - ad-hoc
          - development
          - app-store

permissions:
  contents: write

jobs:
  build-ios:
    name: iOS 构建 (${{ github.event.inputs.export_method || 'ad-hoc' }})
    runs-on: macos-14
    timeout-minutes: 45

    env:
      # 同 Android：显式用官方源，避免依赖国内镜像
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      # 说明（重要）：
      # 1) 不再 `flutter create --platforms=ios`：仓库里的 ios/ 是完整且修正过的
      #    （Xcode 工程 + Podfile + Info.plist），create 只会往仓库里写多余文件。
      # 2) 不再把 IPHONEOS_DEPLOYMENT_TARGET 改成 18.0：macos-14 runner 的
      #    Xcode 15 用的是 iOS 17 SDK，设 18.0 必然构建失败；而且 Podfile 与
      #    依赖的约束是 12.0（permission_handler_apple 要求 12.0）。
      # 3) 不再用 ios/manifest-backup/* 覆盖真实文件：那份 Info.plist 里还留着
      #    没有 SceneDelegate 的 UIApplicationSceneManifest（启动即崩溃），并且
      #    缺少局域网权限与 ATS 例外；备份 Podfile 是 iOS 18 + 与
      #    use_frameworks! 冲突的 use_modular_headers!。
      - name: 安装依赖
        run: flutter pub get

      - name: 安装 CocoaPods
        run: |
          cd ios
          pod install --repo-update 2>&1 | tail -15
          cd ..

      - name: 显示部署目标（便于排查）
        run: |
          grep -m3 'IPHONEOS_DEPLOYMENT_TARGET' ios/Runner.xcodeproj/project.pbxproj || true
          grep -m3 "platform :ios" ios/Podfile || true

      - name: 构建 iOS (无签名)
        run: flutter build ios --release --no-codesign

      - name: ad-hoc 签名
        run: |
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            APP="build/ios/iphoneos/Runner.app"
            codesign --force --sign - --timestamp=none "$APP/Runner" 2>/dev/null || echo "⚠️ Runner 签名跳过"
            find "$APP/Frameworks" -maxdepth 1 -name "*.framework" 2>/dev/null | while read fw; do
              codesign --force --sign - --timestamp=none "$fw" 2>/dev/null || true
            done
            codesign --force --sign - --timestamp=none "$APP" 2>/dev/null || echo "⚠️ App 签名跳过"
            echo "✅ ad-hoc 签名完成"
          fi

      - name: 打包 IPA
        run: |
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            mkdir -p build/ios/ipa/Payload
            cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
            cd build/ios/ipa
            zip -r ../../PerchPlay-${{ github.ref_name }}-unsigned.ipa Payload/
            echo "✅ IPA 打包完成"
          else
            echo "⚠️ 未找到 Runner.app"
            find build/ios -maxdepth 4 -name "Runner.app" 2>/dev/null || echo "搜索失败"
          fi

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.ref_name }}
          path: |
            build/ios/iphoneos/**/*
            build/PerchPlay-*.ipa
          retention-days: 30
          if-no-files-found: warn

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/PerchPlay-*.ipa
          fail_on_unmatched_files: false
