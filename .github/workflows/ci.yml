name: CI — 代码检查

on:
  push:
    branches: [master, standard, main]
  pull_request:
    branches: [master, standard, main]

jobs:
  analyze:
    name: Dart 静态分析
    runs-on: ubuntu-latest
    env:
      # 显式用官方源（pubspec.lock 记录的是国内镜像地址）
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: 安装依赖
        run: |
          set -o pipefail
          flutter pub get --verbose 2>&1 | tail -150

      - name: 静态分析
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tail -60

      - name: 运行测试
        run: |
          set -o pipefail
          flutter test 2>&1 | tail -80
