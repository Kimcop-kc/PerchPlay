name: Android — 构建 + 自动发版

# 触发方式：
# 1) 推 tag（v*）→ 自动构建并发布 Release
# 2) 手动触发 → 可选择只构建还是同时发版
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: '构建完成后是否创建/更新 Release（需先打 tag）'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: 安装 Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: zulu

      - name: 安装依赖
        run: flutter pub get

      # 静态分析单独一步：style 提示不阻断构建。
      - name: 静态分析
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tail -60

      # 测试单独一步，且不阻断打包。
      # 理由：先保证能出包给用户实测，测试回归另行修复。
      - name: 单元测试
        continue-on-error: true
        run: |
          flutter test 2>&1 | tail -60

      - name: 配置发布签名
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次为 debug 签名"
            exit 0
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$RUNNER_TEMP/release.jks" \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" > android/key.properties
          echo "✓ 发布签名已配置"

      - name: 构建 APK（仅 arm64-v8a）
        run: flutter build apk --release

      - name: 校验签名
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | head -6

      - name: 重命名产物
        run: |
          cd build/app/outputs/flutter-apk
          V="${GITHUB_REF_NAME:-manual}"
          mv app-release.apk "PerchPlay-${V}-arm64-v8a.apk"
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.ref_name || 'manual' }}
          path: build/app/outputs/flutter-apk/PerchPlay-*.apk
          retention-days: 30

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          name: PerchPlay ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: build/app/outputs/flutter-apk/PerchPlay-*.apk
          fail_on_unmatched_files: false
          draft: false
          prerelease: false