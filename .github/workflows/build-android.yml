name: Android — 构建 APK + AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        type: choice
        options:
          - apk (分 ABI)
          - aab (Google Play)
          - both

jobs:
  build-android:
    name: Android 构建 (${{ github.event.inputs.build_type || 'aab' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22'
          channel: 'stable'
          cache: true

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: 生成平台文件 (flutter create)
        run: flutter create --platforms=android --org com.vidflow --project-name vidflow . 2>&1 | tail -5

      - name: 安装 Android SDK 平台
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" 2>&1 | tail -5 || true

      - name: 生成 local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          echo "flutter.buildMode=release" >> android/local.properties

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 APK (分 ABI)
        if: ${{ github.event.inputs.build_type == 'apk (分 ABI)' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: flutter build apk --split-per-abi --release 2>&1 | tail -60

      - name: 构建 App Bundle (AAB)
        if: ${{ github.event.inputs.build_type == 'aab (Google Play)' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: flutter build appbundle --release 2>&1 | tail -60

      - name: 列表构建产物
        run: |
          echo "=== APK ==="
          ls -lh build/app/outputs/flutter-apk/*.apk 2>/dev/null || echo "无 APK"
          echo "=== AAB ==="
          ls -lh build/app/outputs/bundle/release/*.aab 2>/dev/null || echo "无 AAB"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: 上传 AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.ref_name }}
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30

      - name: 发布到 GitHub Release (Tag 触发)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}