name: Android — 构建 APK + AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        type: choice
        options:
          - apk (分 ABI)
          - aab (Google Play)
          - both

permissions:
  contents: write

jobs:
  build-android:
    name: Android 构建 (${{ github.event.inputs.build_type || 'aab' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # 走官方源：pubspec.lock 里记录的是 pub.flutter-io.cn 镜像地址，
      # 显式设置 PUB_HOSTED_URL 会让 pub 按当前源重新解析，
      # 避免 GitHub runner 依赖国内镜像（延迟高、偶发不可达）
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22'
          channel: 'stable'
          cache: true

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # 说明（重要）：
      # 1) 不再执行 `flutter create --platforms=android`。仓库里的 android/ 是
      #    完整且经过验证的：create 会按**目录名**推断项目名，生成错误包名的
      #    MainActivity（com.vidflow.video_player_app）以及引用不存在 MyApp 的
      #    test/widget_test.dart，把 CI 的 analyze/test 一起搞挂。
      # 2) 不再 sed 改 build.gradle.kts —— 本项目用的是 build.gradle（Groovy），
      #    根本没有 .kts 文件，那一步会直接让 job 失败。
      #    compileSdk 沿用 flutter.compileSdkVersion（34）即可；媒体库已按
      #    pubspec 注释钉在 media_kit_libs_android_video 1.3.7（compileSdk 31），
      #    不需要 36。
      # 3) 不再用 android/manifest-backup/* 覆盖真实文件 —— 那些备份是旧版本，
      #    会退回组播锁、后台服务通道、networkSecurityConfig 等修复。
      - name: 安装依赖
        run: flutter pub get

      - name: 静态分析 + 测试（快速失败）
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tail -40
          flutter test 2>&1 | tail -40

      - name: 构建 APK (分 ABI)
        if: ${{ github.event.inputs.build_type == 'apk (分 ABI)' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: flutter build apk --split-per-abi --release

      - name: 构建 App Bundle (AAB)
        if: ${{ github.event.inputs.build_type == 'aab (Google Play)' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: flutter build appbundle --release

      - name: 列表构建产物
        run: |
          echo "=== APK ==="
          find build/app/outputs/flutter-apk -name "*.apk" -ls 2>/dev/null || echo "无 APK"
          echo "=== AAB ==="
          find build/app/outputs/bundle -name "*.aab" -ls 2>/dev/null || echo "无 AAB"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: 上传 AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.ref_name }}
          path: build/app/outputs/bundle/**/*.aab
          retention-days: 30
          if-no-files-found: warn

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/**/*.apk
            build/app/outputs/bundle/**/*.aab
          fail_on_unmatched_files: false
