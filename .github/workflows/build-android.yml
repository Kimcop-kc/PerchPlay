name: Android — 双版本构建 + 自动发版

# 触发方式：
# 1) 推 tag（v*）→ 自动构建并发布 Release
#    - tag 名含 "standard" → 构建纯净版（standard 分支）
#    - 其它 tag → 构建旗舰版（master 分支）
# 2) 手动触发 → 可选择只构建还是同时发版
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      variant:
        description: '构建哪个版本'
        required: true
        type: choice
        default: 'both'
        options:
          - both（旗舰版 + 纯净版）
          - ai（仅旗舰版）
          - standard（仅纯净版）
      create_release:
        description: '构建完成后是否创建/更新 Release（需先打 tag）'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────
  # 旗舰版（master 分支，含 AI 字幕/翻译）
  # ────────────────────────────────────────────────
  build-ai:
    name: 旗舰版（AI）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # tag 不含 standard → 构建旗舰版；手动触发选 both/ai 也构建
    if: |
      (github.event_name == 'push' && !contains(github.ref_name, 'standard')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.variant == 'both' || github.event.inputs.variant == 'ai'))

    env:
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: 安装 Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: zulu

      - name: 安装依赖
        run: flutter pub get

      - name: 静态分析 + 测试
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tail -40
          flutter test 2>&1 | tail -40

      - name: 配置发布签名
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次为 debug 签名"
            exit 0
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$RUNNER_TEMP/release.jks" \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" > android/key.properties
          echo "✓ 发布签名已配置"

      - name: 构建 APK（3 架构）
        run: flutter build apk --split-per-abi --release

      - name: 校验签名
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | head -6

      - name: 重命名产物
        run: |
          cd build/app/outputs/flutter-apk
          V="${GITHUB_REF_NAME:-dev}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            [ -f "app-$abi-release.apk" ] && mv "app-$abi-release.apk" "PerchPlay-${V}-ai-full-$abi.apk"
          done
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-ai-${{ github.ref_name || 'manual' }}
          path: build/app/outputs/flutter-apk/PerchPlay-*.apk
          retention-days: 30

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: PerchPlay ${{ github.ref_name }} 旗舰版（AI 全功能）
          body_path: RELEASE_NOTES.md
          files: build/app/outputs/flutter-apk/PerchPlay-*.apk
          fail_on_unmatched_files: false

  # ────────────────────────────────────────────────
  # 纯净版（standard 分支，无 AI）
  # ────────────────────────────────────────────────
  build-standard:
    name: 纯净版（Standard）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # tag 含 standard → 构建纯净版；手动触发选 both/standard 也构建
    if: |
      (github.event_name == 'push' && contains(github.ref_name, 'standard')) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.variant == 'both' || github.event.inputs.variant == 'standard'))

    env:
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com

    steps:
      - uses: actions/checkout@v4
        with:
          ref: standard
          fetch-depth: 0

      - name: 安装 Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: zulu

      - name: 安装依赖
        run: flutter pub get

      - name: 静态分析 + 测试
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tail -40
          flutter test 2>&1 | tail -40

      - name: 配置发布签名
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次为 debug 签名"
            exit 0
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$RUNNER_TEMP/release.jks" \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" > android/key.properties
          echo "✓ 发布签名已配置"

      - name: 构建 APK（3 架构）
        run: flutter build apk --split-per-abi --release

      - name: 校验签名
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | head -6

      - name: 重命名产物
        run: |
          cd build/app/outputs/flutter-apk
          V="${GITHUB_REF_NAME:-dev}"
          # tag 形如 v1.0.79-standard，直接拼会得到 standard-standard；
          # 先剥掉 -standard 后缀再加一次，保证只出现一个 standard。
          VBASE="${V%-standard}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            [ -f "app-$abi-release.apk" ] && mv "app-$abi-release.apk" "PerchPlay-${VBASE}-standard-$abi.apk"
          done
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-standard-${{ github.ref_name || 'manual' }}
          path: build/app/outputs/flutter-apk/PerchPlay-*.apk
          retention-days: 30

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: PerchPlay ${{ github.ref_name }} 纯净版（Standard，无 AI）
          body_path: RELEASE_NOTES.md
          files: build/app/outputs/flutter-apk/PerchPlay-*.apk
          fail_on_unmatched_files: false
