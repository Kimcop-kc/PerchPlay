name: Android — 构建 APK + AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        type: choice
        options:
          - apk (分 ABI)
          - aab (Google Play)
          - both

permissions:
  contents: write

jobs:
  build-android:
    name: Android 构建 (${{ github.event.inputs.build_type || 'aab' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22'
          channel: 'stable'
          cache: true

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: 生成 Android 平台文件
        run: |
          flutter create --platforms=android --org com.vidflow .
          echo "✅ flutter create 完成"

      - name: 设置 compileSdkVersion 36 (media_kit 要求)
        run: |
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/app/build.gradle.kts
          echo "✅ compileSdkVersion 已设为 36"

      - name: 覆盖自定义文件
        run: |
          cp android/manifest-backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android/manifest-backup/styles.xml android/app/src/main/res/values/styles.xml
          cp android/manifest-backup/BackgroundAudioService.kt android/app/src/main/kotlin/com/vidflow/player/BackgroundAudioService.kt
          cp android/manifest-backup/MainActivity.kt android/app/src/main/kotlin/com/vidflow/player/MainActivity.kt
          echo "✅ 自定义文件已覆盖"

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 APK (分 ABI)
        if: ${{ github.event.inputs.build_type == 'apk (分 ABI)' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: flutter build apk --split-per-abi --release

      - name: 构建 App Bundle (AAB)
        if: ${{ github.event.inputs.build_type == 'aab (Google Play)' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: flutter build appbundle --release

      - name: 列表构建产物
        run: |
          echo "=== APK ==="
          find build/app/outputs/flutter-apk -name "*.apk" -ls 2>/dev/null || echo "无 APK"
          echo "=== AAB ==="
          find build/app/outputs/bundle -name "*.aab" -ls 2>/dev/null || echo "无 AAB"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/**/*.apk
          retention-days: 30

      - name: 上传 AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.ref_name }}
          path: build/app/outputs/bundle/**/*.aab
          retention-days: 30

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/**/*.apk
            build/app/outputs/bundle/**/*.aab
          fail_on_unmatched_files: false