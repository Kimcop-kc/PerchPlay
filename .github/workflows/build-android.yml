name: Android — 构建 APK + AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        type: choice
        options:
          - apk (分 ABI)
          - aab (Google Play)
          - both

permissions:
  contents: write

jobs:
  build-android:
    name: Android 构建 (${{ github.event.inputs.build_type || 'aab' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22'
          channel: 'stable'
          cache: true

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: 安装 Android 平台 36
        run: |
          # media_kit_libs_android_video 1.3.8 的 build.gradle 里 compileSdkVersion 36，
          # 需要对应的 platform 才能编过。runner 上 sdkmanager 不一定在 PATH 里。
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          echo "sdkmanager = ${SDKMGR:-<未找到>}"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --install "platforms;android-36" || echo "⚠️ 安装失败，继续让 AGP 处理"
          fi

      - name: 生成 Android 平台文件
        run: |
          flutter create --platforms=android --org com.vidflow .
          echo "✅ flutter create 完成"

      - name: 对齐 namespace / applicationId
        run: |
          # Flutter 3.22 生成的是 Groovy DSL 文件：android/app/build.gradle
          sed -i 's/^\( *\)namespace = .*/\1namespace = "com.vidflow.player"/' android/app/build.gradle
          sed -i 's/^\( *\)applicationId = .*/\1applicationId = "com.vidflow.player"/' android/app/build.gradle
          # compileSdk 保持 Flutter 3.22 的默认值（34）：
          # AGP 8.1 自带的 aapt2 解析不了 API 36 的 android.jar，
          # :app:processReleaseResources 会报 "Failed to load resources table"。
          # media_kit_libs_android_video 自己用 36 只是它模块内部的事，
          # 它没有 aarMetadata.minCompileSdk，不要求上层跟着升。
          grep -nE 'namespace|applicationId|compileSdk' android/app/build.gradle

      - name: 覆盖自定义文件
        run: |
          cp android/manifest-backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android/manifest-backup/styles.xml android/app/src/main/res/values/styles.xml
          cp android/manifest-backup/BackgroundAudioService.kt android/app/src/main/kotlin/com/vidflow/player/BackgroundAudioService.kt
          cp android/manifest-backup/MainActivity.kt android/app/src/main/kotlin/com/vidflow/player/MainActivity.kt
          echo "✅ 自定义文件已覆盖"

      - name: 补齐 BackgroundAudioService 需要的 androidx.core 依赖
        run: |
          cat >> android/app/build.gradle <<'EOF'

          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
          }
          EOF
          tail -5 android/app/build.gradle

      - name: 计算安全产物名
        run: echo "REF_SAFE=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 APK (分 ABI)
        if: ${{ github.event.inputs.build_type == 'apk (分 ABI)' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: flutter build apk --split-per-abi --release

      - name: 构建 App Bundle (AAB)
        if: ${{ github.event.inputs.build_type == 'aab (Google Play)' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: flutter build appbundle --release

      - name: 列表构建产物
        run: |
          echo "=== APK ==="
          find build/app/outputs/flutter-apk -name "*.apk" -ls 2>/dev/null || echo "无 APK"
          echo "=== AAB ==="
          find build/app/outputs/bundle -name "*.aab" -ls 2>/dev/null || echo "无 AAB"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ env.REF_SAFE }}
          path: build/app/outputs/flutter-apk/**/*.apk
          retention-days: 30

      - name: 上传 AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ env.REF_SAFE }}
          path: build/app/outputs/bundle/**/*.aab
          retention-days: 30

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/**/*.apk
            build/app/outputs/bundle/**/*.aab
          fail_on_unmatched_files: false
