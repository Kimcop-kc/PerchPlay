plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// 发布签名：有 android/key.properties 就用正式 keystore，
// 否则回退到 debug 签名（保证别人 clone 下来也能直接构建）。
// key.properties 与 *.jks 都已在 .gitignore 里，不会进仓库。
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseKey = keystorePropertiesFile.exists()
if (hasReleaseKey) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.perchplay.player"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.perchplay.player"
        // 最低支持 Android 7.0 (API 24)；API 29 需要 requestLegacyExternalStorage
        minSdk = 24
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName

        // 只保留 64 位（arm64-v8a）。
        //
        // 踩坑记录（别再重复试这些弯路）：
        //  1. `flutter build apk --target-platform android-arm64` 无效，
        //     产物里仍含三架构 .so（121MB）。
        //  2. 单在这里写 abiFilters 也会被 Flutter Gradle 插件覆盖
        //     （产出 161MB，含三个 ABI）。所以下面另有 afterEvaluate 兜底。
        //  3. `splits.abi` 与 `ndk.abiFilters` **不能共存**，Gradle 直接报
        //     "Conflicting configuration ... cannot be present when splits
        //      abi filters are set"，即使两者取值相同也不行。二选一。
        ndk {
            abiFilters.clear()
            abiFilters 'arm64-v8a'
        }
    }

    // 兜底：Flutter 的 Gradle 插件会在 defaultConfig 之后重写 abiFilters，
    // 把 armeabi-v7a / x86_64 加回来。这里在 evaluate 结束后再强制收窄一次，
    // 保证最终打包只含 arm64-v8a。
    afterEvaluate { project ->
        project.android.defaultConfig.ndk.abiFilters.clear()
        project.android.defaultConfig.ndk.abiFilters.add('arm64-v8a')
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseKey
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
    }

    // sherpa_onnx 和 onnxruntime 各自打包了一份 libonnxruntime.so，
    // AGP 9 的严格检查会报「2 files found with path」冲突。取同一份即可
    // （两者都是同一个 onnxruntime 库），排除 sherpa 内置的那份避免冲突。
    packagingOptions {
        pickFirst 'lib/arm64-v8a/libonnxruntime.so'
        pickFirst 'lib/armeabi-v7a/libonnxruntime.so'
        pickFirst 'lib/x86_64/libonnxruntime.so'
        pickFirst 'lib/x86/libonnxruntime.so'
        pickFirst '**/libonnxruntime.so'
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
}

// 部分插件带进来的 kotlin-stdlib 版本过旧，与新版 Kotlin 插件产生版本冲突。
// 统一强制到与 Kotlin 2.4.0 插件一致。
configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:2.4.0"
    }
}

flutter {
    source = "../.."
}
