org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 旧插件（volume_controller 2.x 等）Kotlin jvmTarget 1.8 与 Flutter 3.47 的 Java 11
# 冲突，Kotlin 2.x 默认报错。这里降级为 warning，避免阻断构建（功能不受影响）。
kotlin.jvm.target.validation.mode=warning
# 注意：不要在这里硬编码 systemProp.http(s).proxyHost。
# 本地开发走 Clash 代理时，用环境变量或命令行传入：
#   flutter build apk --release --dart-define=... 或设置 GRADLE_OPTS
# 硬编码 127.0.0.1:7897 会让 GitHub Actions（无该代理）直接
# "java.net.ConnectException: Connection refused" 构建失败。
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# 跨盘构建（PUB_CACHE 在 D 盘、项目在 C 盘）时 Kotlin 增量缓存会因
# 「this and base files have different roots」崩溃，关闭增量编译规避。
kotlin.incremental=false
